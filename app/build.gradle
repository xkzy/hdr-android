plugins {
    id 'com.android.application'
    // Kotlin support is built into AGP 9+; no separate kotlin-android plugin needed.
}

android {
    namespace 'com.example.hdrfusion'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.hdrfusion"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // No JDK 17 toolchain is installed on this machine (only JDK 25), and Gradle's
    // toolchain resolution won't auto-provision one without the foojay plugin — pin the
    // Kotlin toolchain to the JDK actually available. compileOptions above still targets
    // language level 17 bytecode; Android's D8/R8 step converts to Android's own format
    // regardless of the JVM that produced the .class files.
    kotlin {
        jvmToolchain(25)
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0'
}
