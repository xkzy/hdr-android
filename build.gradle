buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Kotlin support is built into AGP 9+ (runtime-dependent on Kotlin Gradle
        // plugin 2.2.10); no separate kotlin-gradle-plugin classpath entry needed.
        classpath "com.android.tools.build:gradle:9.3.0"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
