# -Duser.language/-Duser.country pin the Gradle JVM to a Gregorian-calendar locale.
# On a system locale like th_TH, Java's default Calendar.getInstance() returns a
# BuddhistCalendar (year 2569, not 2026); AGP's APK packer (apkzlib) does raw
# Gregorian year arithmetic on that for zip-entry timestamps and throws
# VerifyException. This doesn't touch the system/user locale, only this JVM.
org.gradle.jvmargs=-Xmx2048m -Duser.language=en -Duser.country=US
android.useAndroidX=true
kotlin.code.style=official
